[server]
headless = true
maxUploadSize = 200
enableXsrfProtection = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#1d1d1f"
backgroundColor = "#fbfbf9"
secondaryBackgroundColor = "#f4f2ec"
textColor = "#1d1d1f"
linkColor = "#7a6537"
borderColor = "#e3e0d8"
showWidgetBorder = true
baseRadius = "14px"
buttonRadius = "full"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
headingFont = "'Source Serif 4', 'Iowan Old Style', Palatino, Georgia, serif"
codeFont = "'JetBrains Mono', ui-monospace, Menlo, monospace"
blueColor = "#44608a"
blueBackgroundColor = "#f3f3f1"
blueTextColor = "#424245"
greenColor = "#2f6b4f"
greenBackgroundColor = "#eef3ee"
greenTextColor = "#234f3a"
yellowColor = "#9d8552"
yellowBackgroundColor = "#f4efe3"
yellowTextColor = "#5f4a1e"
redColor = "#8c2f2a"
redBackgroundColor = "#f6ecea"
redTextColor = "#6e2420"
dataframeBorderColor = "#eeebe4"
dataframeHeaderBackgroundColor = "#fdfcf7"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Source Serif 4"
url = "app/static/source-serif-4-latin-wght-normal.woff2"
weight = "200 900"
style = "normal"

[[theme.fontFaces]]
family = "Source Serif 4"
url = "app/static/source-serif-4-latin-wght-italic.woff2"
weight = "200 900"
style = "italic"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/jetbrains-mono-latin-wght-normal.woff2"
weight = "100 800"
style = "normal"
