# Weekly checks for newer versions of the Python packages and of the GitHub Actions used by the workflows.
# The versions in requirements.txt are exact on purpose (the set the tests ran on); Dependabot proposes each move as a pull request,
# and the tests run on it before anything is merged.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # the engine's numbers were checked on these exact versions; move them by hand, with the scorecard baseline (tests/pressure/baseline.py)
      - dependency-name: "torch"
      - dependency-name: "numpy"
      - dependency-name: "pandas"
      - dependency-name: "scikit-learn"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
